    <radialGradient id="g_bac" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#D0AAFF"/><stop offset="50%" stop-color="#7030C8"/><stop offset="100%" stop-color="#280050"/>
    </radialGradient>
    <radialGradient id="g_ves" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#FFE8A8"/><stop offset="50%" stop-color="#C09820"/><stop offset="100%" stop-color="#484000"/>
    </radialGradient>
    <radialGradient id="g_pan" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#FFE888"/><stop offset="50%" stop-color="#C09010"/><stop offset="100%" stop-color="#483000"/>
