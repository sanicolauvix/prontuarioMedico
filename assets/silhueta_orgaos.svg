<?xml version="1.0" encoding="UTF-8"?>
<!-- Mapa anatomico orgaos internos v4 -- sem silhueta, mais espacados -->
<!-- viewBox 0 0 340 820 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 820" width="340" height="820">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#141C28"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
    <!-- Gradientes 3D -->
    <radialGradient id="g_tir" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#C0B8FF"/><stop offset="50%" stop-color="#5840D0"/><stop offset="100%" stop-color="#180060"/>
    </radialGradient>
    <radialGradient id="g_cor" cx="32%" cy="28%" r="68%">
      <stop offset="0%"  stop-color="#FF8888"/><stop offset="45%" stop-color="#CC1111"/><stop offset="100%" stop-color="#5A0000"/>
    </radialGradient>
    <radialGradient id="g_pulm" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#A8D8FF"/><stop offset="50%" stop-color="#2272CC"/><stop offset="100%" stop-color="#082848"/>
    </radialGradient>
    <radialGradient id="g_fig" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#FFAA66"/><stop offset="50%" stop-color="#C05010"/><stop offset="100%" stop-color="#501800"/>
