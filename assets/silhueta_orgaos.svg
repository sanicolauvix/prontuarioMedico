    <radialGradient id="g_bex" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#A8CCFF"/><stop offset="50%" stop-color="#2050C8"/><stop offset="100%" stop-color="#081040"/>
    </radialGradient>
    <radialGradient id="g_pro" cx="30%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#C8AAFF"/><stop offset="50%" stop-color="#6030C0"/><stop offset="100%" stop-color="#200048"/>
    </radialGradient>
    <!-- Highlight especular -->
    <radialGradient id="hl" cx="28%" cy="22%" r="42%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </radialGradient>
    <!-- Filtros -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="340" height="820" fill="url(#bg)"/>
